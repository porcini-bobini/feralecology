<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feral Ecology</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/png" href="images/anenome.jpg">
    <link href="https://fonts.cdnfonts.com/css/diatype-mono-variable" rel="stylesheet">
</head>
<body>
    <div class="site-container">
        <div class="background-container">
            <div class="background"></div>
        </div>
        <aside class="sidebar">
              <h1 class="site-title-text">FERAL ECOLOGY</h1>
              <!-- <img src="images/feral-ecology-text.png" alt="Logo" class="site-title"> -->
            <nav>
                <ul class="nav-menu">
                    <li class="nav-item">
                        <a href="#about" class="nav-link">ABOUT</a>
                    </li>
                    <li class="nav-item">
                        <a href="#events" class="nav-link">EVENTS</a>
                    </li>
                    <li class="nav-item">
                        <a href="#mailing-list" class="nav-link">CONNECT</a>
                    </li>
                    <li class="nav-item">
                        <a href="#gallery" class="nav-link">GALLERY</a>
                    </li>
                    <li class="nav-item">
                        <a href="#contact" class="nav-link">CONTACT</a>
                    </li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <section id="about" class="section">
              <div class="about-flex">
                <div class="profile-container">
                  <div class="profile-shape">
                    <div class="profile-blob-bg"></div>
                    <img src="images/profile_1.jpg" alt="Wine Pouring" class="profile-image">
                  </div>
                </div>
                <div class="content-box">
                    <h2 class="section-title">ABOUT</h2>
                    <p id="about-text" />
                </div>
              </div>
            </section>

            <section id="events" class="section">
                <div class="content-box">
                    <h2 class="section-title">UPCOMING EVENTS</h2>
                    <div class="events-grid">
                        <!-- Events will be populated via JavaScript -->
                    </div>
                </div>
            </section>

            <section id="mailing-list" class="section">
                <div class="content-box">
                    <h2 class="section-title">JOIN OUR COMMUNITY</h2>
                    <p class="section-title">Stay updated with our latest releases, events, and foraging adventures.</p>
                    <div class="form-container">
                        <iframe src="https://docs.google.com/forms/d/1vCYmJkFIV7W4Jj-Y97gANwgvk4lWeNA2UzUoPY15Wvs/viewform?embedded=true" 
                                width="100%" 
                                height="500" 
                                frameborder="0" 
                                marginheight="0" 
                                marginwidth="0">
                            Loading…
                        </iframe>
                    </div>
                </div>
            </section>

            <section id="gallery" class="section">
                <div class="content-box">
                    <h2 class="section-title">GALLERY</h2>
                    <div class="gallery-grid">
                        <!-- Gallery items will be populated via JavaScript -->
                    </div>
                </div>
            </section>

            <section id="contact" class="section">
                <div class="content-box">
                    <h2 class="section-title">CONTACT</h2>
                    <ul class="contact-list">
                        <li class="contact-item">
                            <a href="https://instagram.com/porcini_bobini" class="contact-link" target="_blank">Instagram: @porcini_bobini</a>
                        </li>
                        <li class="contact-item">
                            <a href="mailto:shuckersprize@gmail.com" class="contact-link">Email: shuckersprize@gmail.com</a>
                        </li>
                    </ul>
                </div>
            </section>
        </main>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
